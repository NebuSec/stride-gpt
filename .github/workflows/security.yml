name: Security Scanning

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Run security scans weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  python-security:
    name: Python Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.lock
          pip install -r requirements.lock
          pip install bandit[toml] pip-audit

      - name: Run Bandit security linter
        run: |
          # Full-fidelity report for the artifact: every severity, never gates.
          bandit -c pyproject.toml -r . -f json -o bandit-report.json || true
          # The gate. -ll -ii fails the job on medium-or-above severity at
          # medium-or-above confidence. Anything quieter stays in the artifact
          # above rather than failing the build.
          bandit -c pyproject.toml -r . -f txt -ll -ii

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          # Full-fidelity report for the artifact, same split as Bandit above.
          pip-audit --desc --format json > pip-audit-report.json || true
          # The gate. pip-audit exits non-zero on any known vulnerability.
          # If a transitive dependency picks up a CVE with no fix available,
          # suppress it here with `--ignore-vuln GHSA-xxxx` and a reason, so the
          # exception lands in a reviewable diff rather than being blanket
          # ignored by continue-on-error.
          pip-audit --desc

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The CLI, not gitleaks/gitleaks-action: the action refuses to run
      # without a paid license on an organization's repository, so this job
      # failed on every run in this repository. The image is
      # pinned by digest (v8.30.1). Every commit is scanned: the whole history
      # takes about two seconds.
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 .

  # CodeQL runs as the repository's default setup (python and actions), which
  # is its own "CodeQL" check. GitHub refuses SARIF from an advanced workflow
  # while default setup is on, so a CodeQL job here failed on every run.

  docker-security:
    name: Docker Image Security
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -f Dockerfile.ui -t stride-gpt:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stride-gpt:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          # `severity` alone does not apply to SARIF output; without this the
          # Security tab also collects LOW/UNKNOWN base-image findings.
          limit-severities-for-sarif: true
          # Base-image CVEs with no vendor patch cannot be actioned here, and
          # they crowd out the findings that can be.
          ignore-unfixed: true
          # pip ships a CycloneDX SBOM of its own vendored tree. Trivy parses
          # embedded SBOMs, so those pins surface as installed packages
          # (setuptools 70.3.0, msgpack 1.1.2) under a bare `Python` target
          # even though nothing on the filesystem holds them. The glob skips
          # every copy of the file without naming the Python version, so a
          # base-image bump does not bring the findings back. Real
          # site-packages metadata is still scanned.
          skip-files: |
            **/pip/_vendor/bom.cdx.json

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy in table format
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stride-gpt:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          skip-files: |
            **/pip/_vendor/bom.cdx.json

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [python-security, secret-scanning]
    if: always()

    steps:
      - name: Check security scan results
        env:
          PYTHON_SECURITY: ${{ needs.python-security.result }}
          SECRET_SCANNING: ${{ needs.secret-scanning.result }}
        run: |
          # The icon has to follow the result. Hardcoding ✅ made a failed scan
          # read as "✅ Secret Scanning: failure", which is how weekly Gitleaks
          # failures went unnoticed.
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⚠️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❔" ;;
            esac
          }
          {
            echo "## Security Scan Summary"
            echo ""
            echo "$(icon "$PYTHON_SECURITY") Python Security: $PYTHON_SECURITY"
            echo "$(icon "$SECRET_SCANNING") Secret Scanning: $SECRET_SCANNING"
            echo ""
            echo "View detailed results in the workflow logs and Security tab."
          } >> "$GITHUB_STEP_SUMMARY"
